services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: padukue-app:prod
    container_name: padukue_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - AUTORUN_MIGRATIONS=${AUTORUN_MIGRATIONS:-true}
      - AUTORUN_QUEUE_WORKER=${AUTORUN_QUEUE_WORKER:-false}
      - CHROME_PATH=/usr/bin/chromium-browser
    volumes:
      - padukue_storage:/var/www/html/storage/app
      - padukue_logs:/var/www/html/storage/logs
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  padukue_storage:
    name: padukue_storage
  padukue_logs:
    name: padukue_logs

networks:
  ai_network:
    external: true
